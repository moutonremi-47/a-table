<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>À table</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="À table">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e7e2d8;
  --accent:#1f2328; --warn:#d9480f; --ok:#2b8a3e;
  --d1:#3b82f6; --d2:#8b5cf6; --d3:#f97316; --d4:#22c55e; --d5:#eab308; --d6:#ec4899; --d7:#14b8a6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:430px;min-height:100%;display:flex;flex-direction:column;padding:10px 6px 10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Bandeau */
.top{display:flex;align-items:center;gap:6px;padding:0 4px 8px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.3px;flex:1;white-space:nowrap}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:46px;border-radius:12px;
  background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:10px;font-weight:600;gap:1px}
.act span{font-size:18px;line-height:1}
.week{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;padding:0 2px 6px}
.week small{font-weight:500;color:var(--muted)}

/* Semainier : flèches de chaque côté */
.board{display:block}
.nav{width:34px;height:30px;flex:none;border-radius:10px;font-size:20px!important;line-height:1;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08);font-size:15px;font-weight:800;color:var(--muted)}
.nav:active{background:var(--line)}

/* UNE LIGNE PAR JOUR : 5 colonnes fixes, aucun retour à la ligne possible */
.cols,.day{display:grid;grid-template-columns:36px 34px 34px minmax(0,1fr) 84px;gap:3px;align-items:stretch}
.cols{grid-template-columns:36px minmax(0,1fr) 84px}
.day{transition:grid-template-columns .2s ease}
.cols{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);padding:0 0 3px;text-align:center}
.cols .c-din{text-align:start;padding-inline-start:4px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols .c-tot{text-align:end;padding-inline-end:6px}
.days{display:flex;flex-direction:column;gap:4px}
.day{height:66px;border-radius:12px;padding:3px;background:color-mix(in srgb,var(--c) 14%,white)}
.d-name{border-radius:9px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.d-name b{font-size:11px;text-transform:uppercase}
.d-name i{font-style:normal;font-size:15px;font-weight:800}
.meal{border-radius:9px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:17px;min-width:0;overflow:hidden}
.meal.empty{font-size:15px;color:var(--muted);background:rgba(255,255,255,.5);border:1.5px dashed color-mix(in srgb,var(--c) 45%,white)}
.meal:active{outline:2px solid var(--c)}
.din{justify-content:flex-start;gap:5px;padding:0 5px;background:#fff;box-shadow:inset 3px 0 0 var(--c)}
.din .em{font-size:22px;flex:none}
.din .tx{min-width:0;flex:1;text-align:start;display:flex;flex-direction:column;line-height:1.15}
.din .nm{font-size:12.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.din .mt{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.din.empty{justify-content:center;font-size:12px;font-weight:600}
.tot{border-radius:9px;background:rgba(255,255,255,.9);padding:3px 5px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;line-height:1.1;white-space:nowrap}
.tot .k{font-size:14px;font-weight:800}
.tot .k small{font-size:9px;font-weight:600;color:var(--muted)}
.tot .n{font-size:9px;letter-spacing:-.2px;color:var(--muted);font-variant-numeric:tabular-nums}
.tot .n b{font-weight:700;color:var(--ink)}
.tot .n b.hi{color:var(--warn)}

/* Total semaine vs besoins */
.weekbar{margin:8px 0 0;background:var(--card);border-radius:14px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.weekbar h2{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.w .l{font-size:10px;color:var(--muted)}
.w .v{font-size:12.5px;font-weight:800;white-space:nowrap}
.w .v small{font-weight:500;color:var(--muted);font-size:9.5px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.bar i.hi{background:var(--warn)}

/* Panneaux bas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:5}
.scrim.open{display:flex}
.sheet::-webkit-scrollbar{display:none;width:0}
.sheet{scrollbar-width:none;width:100%;max-width:430px;max-height:86%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px 22px}
.sheet h3{font-size:16px;margin-bottom:2px}
.sheet p.sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.rlist{display:flex;flex-direction:column;gap:6px}
.r{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg);text-align:start;width:100%}
.r .em{font-size:26px}
.r .nm{font-weight:700;font-size:14px}
.r .mt{font-size:11px;color:var(--muted)}
.r.cur{outline:2px solid var(--accent)}
.rm{margin-top:10px;width:100%;padding:10px;border-radius:12px;background:#fff0ec;color:var(--warn);font-weight:700}
.shop li{list-style:none;display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.shop li span:last-child{color:var(--muted)}
table.need{width:100%;border-collapse:collapse;font-size:13px}
table.need td,table.need th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:end}
table.need td:first-child,table.need th:first-child{text-align:start}
.close{float:right;font-size:20px;color:var(--muted)}
/* Module de sélection d'un repas */
.sheet.picker{height:86%;display:flex;flex-direction:column;padding-bottom:12px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pday{color:#fff;font-weight:800;font-size:13px;border-radius:10px;padding:8px 10px;white-space:nowrap}
.ph>div{flex:1;min-width:0}.ph .sub{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close.pc{float:none;align-self:flex-start}
.rl{font-size:11px;color:var(--muted);margin:0 2px 4px;font-weight:600}.rest{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}.rest span{background:var(--bg);border-radius:10px;padding:5px 4px;text-align:center;font-size:14px;line-height:1.15;white-space:nowrap}.rest i{display:block;font-style:normal;font-size:10px;color:var(--muted)}
.rest b{color:var(--ink);font-weight:800} .rest b.neg{color:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:9px;font-size:10.5px;font-weight:600;color:var(--muted)}
.tab span{font-size:17px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pbody{flex:1;overflow-x:hidden;overflow-y:auto;min-height:0;display:flex;flex-direction:column;scrollbar-width:none}.pbody::-webkit-scrollbar{display:none;width:0}.pbody>*{flex:none}.pbody>.car{flex:1 1 auto;min-height:200px}
.search{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
.search.inline{flex:1;min-width:96px;width:auto;padding:7px 10px;font-size:14px}
.hint{font-size:11.5px;color:var(--muted);margin:8px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{padding:6px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;border:1.5px solid var(--line)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.r .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:#f59f00}
.badge{font-size:10px;font-weight:700;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:#ebe7de;color:var(--muted)}
.tag.ok{background:#e6f4ea;color:var(--ok)} .tag.warn{background:#fff0ec;color:var(--warn)}
.score{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px;color:#fff;background:linear-gradient(90deg,var(--ok) var(--v),#9fb8a5 var(--v))}


.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0 2px}
.cat{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 0 3px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line);font-size:9.5px;font-weight:700;color:var(--muted);line-height:1.15;min-width:0}
.cat span{font-size:15px}
.cat b{font-size:9px;font-weight:600;opacity:.8}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat.zero{opacity:.4}


.meal.mini{flex-direction:column;gap:1px;padding:0}
.meal.mini .me{font-size:17px;line-height:1}
.meal.mini .ml{font-size:8px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:-.2px}
.meal.mini.empty .me{font-size:15px}
.din .lb{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:color-mix(in srgb,var(--c) 75%,black)}
.din.empty .tx{align-items:flex-start}
/* Repas agrandi */
.meal,.din{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.zoom{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;animation:zf .15s ease-out}
@keyframes zf{from{opacity:0}to{opacity:1}}
.zc{width:100%;max-width:400px;max-height:92%;overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);border-top:6px solid var(--c);animation:zs .18s ease-out;user-select:none;-webkit-user-select:none;touch-action:manipulation;scrollbar-width:none}
.zc::-webkit-scrollbar{display:none}
@keyframes zs{from{transform:scale(.85)}to{transform:scale(1)}}
.zh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.zh b{font-size:17px;flex:1}
.zx{float:none}
.zc .ph-img{height:180px;max-height:none;flex:none}
.zb{padding:10px 14px 4px}
.zb h3{font-size:19px;margin-bottom:8px}
.zn{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.zn span{background:var(--bg);border-radius:10px;padding:6px 2px;text-align:center;font-size:10px;color:var(--muted)}
.zn b{display:block;font-size:15px;color:var(--ink)}
.zi li{list-style:none;display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.zi li span:last-child{color:var(--muted)}
.zempty{padding:30px 10px;text-align:center;color:var(--muted)}.zempty span{font-size:50px}
.zhint{margin:10px 12px 12px;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,white);text-align:center;font-size:13px;font-weight:700}
/* Courses */
.shopsum{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 2px}
.shopsum span{background:var(--bg);border-radius:10px;padding:7px;text-align:center;font-size:12px;color:var(--muted)}
.shopsum b{font-size:17px;color:var(--ink);margin-inline-end:3px}
.shop li{padding:0!important}
.shop label{display:flex;align-items:center;gap:10px;width:100%;padding:9px 2px;cursor:pointer}
.shop input{width:20px;height:20px;accent-color:var(--ok);flex:none}
.shop .nm{flex:1}.shop .q{color:var(--muted)}
.shop li.done .nm{text-decoration:line-through;color:var(--muted)}
/* Carrousel de photos */
.car-h{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 4px}
.car-h .hint{margin:0}.pos{font-size:11.5px;font-weight:700;color:var(--muted)}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 12px 6px;margin:0 -14px;scroll-padding:0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar,.chips.season::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.car,.chips.season{-ms-overflow-style:none;scrollbar-width:none;overflow-y:hidden}
.slide{position:relative;flex:0 0 82%;scroll-snap-align:center;border-radius:18px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column}
.slide.cur{outline:3px solid var(--ink);outline-offset:-3px}
.ph-img{flex:1 1 auto;min-height:56px;max-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,hsl(var(--h) 85% 82%),hsl(var(--h) 60% 58%));position:relative}
.ph-img span{font-size:clamp(60px,10vh,84px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.ph-img i{position:absolute;bottom:6px;inset-inline-end:10px;font-size:9.5px;font-style:normal;color:rgba(255,255,255,.9)}
.fav{position:absolute;top:8px;inset-inline-end:10px;background:rgba(255,255,255,.92);color:#f59f00;border-radius:999px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px}
.badge.on-img{position:absolute;top:10px;inset-inline-start:10px}
.sb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.sb h5{font-size:15.5px;line-height:1.2}
.sb .mt{font-size:11.5px;color:var(--muted)}
.sb .tags{min-height:18px;flex-wrap:nowrap;overflow:hidden}.sb .tags>*{flex:none}
.pick-btn{margin-top:auto;padding:9px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px}
.slide.cur .pick-btn{background:var(--bg);color:var(--ink)}
.dots{display:flex;justify-content:center;gap:5px;margin-top:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:8px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:700;color:var(--muted);border:1.5px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips.season{margin-top:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.season::-webkit-scrollbar{display:none}
.chip.sm{flex:none;padding:4px 9px;font-size:12px}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin:4px 2px 6px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.card{flex:none;width:112px;border-radius:14px;background:var(--bg);padding:10px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start}
.card .em{font-size:28px}.card .nm{font-size:12.5px;font-weight:700;line-height:1.2;height:45px;overflow:hidden}.card .mt{font-size:11px;color:var(--muted)}

@media (prefers-color-scheme: dark){/* maquette volontairement claire */}
@media (max-height:780px){.sheet.picker{height:92%}.ph-img span{font-size:48px!important}.cats{margin:5px 0 0}.cat span{font-size:13px}.ph-img span{font-size:54px}.rest span{padding:3px 4px;font-size:13px}.tab{padding:4px 2px}.tab span{font-size:15px}.ph{margin-bottom:4px}.sb{padding:8px 12px 10px}.pick-btn{padding:7px}.car-h{margin:6px 2px 3px}.hint{margin:6px 2px 4px}}
@media print{.scrim{display:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">🍽️ À table</div>
    <button class="act" data-open="add"><span>➕</span>Recette</button>
    <button class="act" data-open="shop"><span>🛒</span>Courses</button>
    <button class="act" data-open="need"><span>📊</span>Besoins</button>
  </header>
  <div class="week"><button class="nav" id="prev" aria-label="Semaine précédente">‹</button><span id="weekLabel"></span><button class="nav" id="next" aria-label="Semaine suivante">›</button></div>

  <section class="board">
    <div>
      <div class="cols"><span>Jour</span><span class="c-din">Repas · 1 clic : déplier · 2 clics : changer</span><span class="c-tot">Total jour</span></div>
      <div class="days" id="days"></div>
    </div>
  </section>

  <section class="weekbar" id="weekbar"></section>
</main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
const R=[

 {id:'pates',cat:'viande',em:'🍝',nm:'Pâtes bolognaise maison',k:680,p:32,f:6,s:11,fav:1,n:17,ing:[['Pâtes',90,'g'],['Bœuf haché',100,'g'],['Coulis de tomate',120,'g'],['Carottes',40,'g'],['Oignon',0.25,'pc']]},
 {id:'soupe',cat:'soupe vege',em:'🥣',nm:'Velouté potimarron',k:290,p:7,f:6,s:10,fav:0,n:6,ing:[['Potimarron',250,'g'],['Oignon',0.5,'pc'],['Crème',3,'cl']]},
 {id:'quiche',cat:'vege',em:'🥧',nm:'Quiche poireaux',k:560,p:18,f:3,s:4,fav:0,n:5,ing:[['Pâte brisée',0.25,'pc'],['Poireaux',150,'g'],['Œufs',1,'pc'],['Crème',5,'cl']]},
 {id:'salade',cat:'vege rapide',em:'🥗',nm:'Salade lentilles & feta',k:470,p:24,f:11,s:5,fav:1,n:8,ing:[['Lentilles',70,'g'],['Feta',40,'g'],['Carottes',80,'g'],['Oignon',0.25,'pc']]},
 {id:'wok',cat:'viande rapide',em:'🥢',nm:'Wok bœuf légumes',k:500,p:35,f:5,s:9,fav:0,n:7,ing:[['Bœuf émincé',120,'g'],['Poivrons',100,'g'],['Nouilles',60,'g'],['Brocolis',60,'g']]},
 {id:'yaourt',cat:'gouter rapide',em:'🥛',nm:'Yaourt & granola',k:240,p:10,f:3,s:16,fav:0,n:21,ing:[['Yaourt nature',1,'pc'],['Granola',30,'g']]},

if(location.hash.startsWith('#shopdone')){have[0]={'Oignon|pc':1,'Crème|cl':1,'Riz|g':1};shop()}
const h=location.hash.match(/pick=(\d),(\w+),(\w+)(?:,(.*))?/);if(h){pick(+h[1],h[2],h[3]);if(h[4]){pk.chips=decodeURIComponent(h[4]).split('+');drawPick()}}
</script>
